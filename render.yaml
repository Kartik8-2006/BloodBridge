# Render Blueprint: creates the API service. Secrets are entered in the Render dashboard (sync: false).
services:
  - type: web
    name: bloodbridge-api
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: PORT, value: 4000 }
      - { key: CLIENT_URL, sync: false }          # your Vercel URL, e.g. https://bloodbridge.vercel.app
      - { key: DATABASE_URL, sync: false }        # Supabase pooled connection string
      - { key: CLERK_PUBLISHABLE_KEY, sync: false }
      - { key: CLERK_SECRET_KEY, sync: false }
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_SERVICE_ROLE_KEY, sync: false }
      - { key: SUPABASE_STORAGE_BUCKET, value: hospital-documents }
      - { key: OSM_CONTACT_EMAIL, sync: false }
      - { key: GEMINI_API_KEY, sync: false }      # optional
      - { key: RAZORPAY_KEY_ID, sync: false }     # optional, billing is off without these three
      - { key: RAZORPAY_KEY_SECRET, sync: false }
      - { key: RAZORPAY_WEBHOOK_SECRET, sync: false }
